<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Marketplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col justify-between">

    <!-- En-tête de la Boutique -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 id="shop-title" class="text-xl font-bold text-gray-800">Chargement de la boutique...</h1>
                <p id="shop-subtitle" class="text-xs text-gray-500">Catalogue en ligne</p>
            </div>
            <a href="admin.html" class="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg font-medium hover:bg-gray-200 transition">Espace Vendeur</a>
        </div>
    </header>

    <!-- Corps de la Boutique -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Les produits injectés dynamiquement par JS -->
            <p class="text-gray-400 col-span-full text-center py-12">Chargement des produits...</p>
        </div>
    </main>

    <!-- Modal de commande / Tunnel d'achat -->
    <div id="order-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl relative">
            <h3 id="modal-product-title" class="text-lg font-bold text-gray-800">Commander ce produit</h3>
            
            <form id="order-form" class="space-y-3">
                <input type="hidden" id="modal-product-id">
                <input type="hidden" id="modal-vendor-id">
                
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Quantité</label>
                    <input type="number" id="modal-qty" min="1" value="1" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Votre Numéro WhatsApp</label>
                    <input type="text" id="modal-phone" required placeholder="ex: +2250700000000" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Lieu de livraison</label>
                    <input type="text" id="modal-location" required placeholder="ex: Abidjan, Yopougon" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-700 transition">Commander via WhatsApp</button>
                    <button type="button" id="close-modal-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-300 transition">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pied de page -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-400">
        Propulsé par Marketplace - Solution e-commerce simplifiée
    </footer>

    <!-- Scripts du projet -->
    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
