<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Marketplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- En-tête Storefront -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">Marketplace</h1>
            <a href="admin.html" class="text-sm bg-gray-100 px-3 py-1.5 rounded-lg font-medium text-gray-700 hover:bg-gray-200 transition">Espace Vendeur</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-8">
        
        <!-- SECTION RECHERCHE / FILTRE -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border">
            <input type="text" id="search-input" placeholder="Rechercher un produit..." class="w-full md:w-96 px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <div class="text-sm text-gray-500" id="products-count">Chargement des produits...</div>
        </div>

        <!-- GRILLE DES PRODUITS -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Les produits s'afficheront ici dynamiquement -->
        </div>

    </main>

    <!-- MODAL DE COMMANDE -->
    <div id="order-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 id="modal-product-name" class="text-lg font-bold text-gray-800">Commander le produit</h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="order-form" class="space-y-4">
                <input type="hidden" id="modal-product-id">
                <input type="hidden" id="modal-vendor-id">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quantité</label>
                    <input type="number" id="modal-qty" value="1" min="1" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Votre numéro WhatsApp</label>
                    <input type="text" id="modal-phone" placeholder="ex: +2250700000000" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lieu de livraison / Adresse</label>
                    <input type="text" id="modal-location" placeholder="ex: Abobo, Pharmacie Gbekou" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-medium hover:bg-green-700 transition">Valider et commander sur WhatsApp</button>
            </form>
        </div>
    </div>

    <!-- Scripts du projet -->
    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
